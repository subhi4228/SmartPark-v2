<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%">
  <rect width="780" height="400" fill="#0f172a" rx="10"/>
  <text x="390" y="32" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Microprogrammed Control Store Architecture</text>

  <!-- Address Sequencer -->
  <rect x="50" y="130" width="140" height="110" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="120" y="175" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Micro-Address</text>
  <text x="120" y="195" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Sequencer</text>

  <!-- Control Store ROM -->
  <rect x="260" y="90" width="180" height="190" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="350" y="150" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Control Store ROM</text>
  <text x="350" y="175" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="Segoe UI">(States 0 - 15)</text>
  <text x="350" y="200" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Segoe UI">Fetch &bull; Decode &bull; Exec &bull; WB</text>

  <!-- Micro-Instruction Register -->
  <rect x="510" y="110" width="220" height="150" fill="#1e293b" stroke="#22c55e" stroke-width="2" rx="6"/>
  <text x="620" y="145" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">&mu;-Instruction Register (&mu;IR)</text>
  <text x="530" y="180" fill="#f8fafc" font-size="11" font-family="Segoe UI">Control Word (RegDst, ALUSrc...)</text>
  <text x="530" y="210" fill="#a855f7" font-size="11" font-family="Segoe UI">Next Address / Branch Field</text>

  <!-- Feedback Line -->
  <path d="M 620 260 L 620 330 L 120 330 L 120 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" fill="none"/>
  <text x="370" y="320" fill="#a855f7" font-size="11" text-anchor="middle" font-family="Segoe UI">Next Micro-Address Feedback</text>

  <!-- Connecting Arrows -->
  <path d="M 190 185 L 260 185" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 440 185 L 510 185" stroke="#38bdf8" stroke-width="2" fill="none"/>
</svg>
