<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <rect width="950" height="500" fill="#0f172a" rx="10"/>
  <text x="475" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle" font-family="Segoe UI, sans-serif">Smart Amusement Park - 32-bit RISC Datapath Architecture</text>
  
  <!-- PC -->
  <rect x="40" y="200" width="60" height="90" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="70" y="245" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">PC</text>
  
  <!-- Instruction Memory -->
  <rect x="140" y="180" width="120" height="130" fill="#1e293b" stroke="#22c55e" stroke-width="2" rx="6"/>
  <text x="200" y="235" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Instruction</text>
  <text x="200" y="255" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Memory</text>
  
  <!-- Register File -->
  <rect x="320" y="150" width="150" height="200" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="6"/>
  <text x="395" y="185" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Register File</text>
  <text x="340" y="220" fill="#94a3b8" font-size="11" font-family="Segoe UI">Read Reg 1 (rs)</text>
  <text x="340" y="250" fill="#94a3b8" font-size="11" font-family="Segoe UI">Read Reg 2 (rt)</text>
  <text x="340" y="280" fill="#94a3b8" font-size="11" font-family="Segoe UI">Write Reg (rd/rt)</text>
  <text x="340" y="310" fill="#94a3b8" font-size="11" font-family="Segoe UI">Write Data</text>
  
  <!-- ALU Mux -->
  <rect x="520" y="260" width="30" height="60" fill="#334155" stroke="#f59e0b" rx="4"/>
  <text x="535" y="295" fill="#f59e0b" font-size="10" text-anchor="middle" font-family="Segoe UI">Mux</text>
  
  <!-- ALU -->
  <polygon points="590,170 680,210 680,270 590,310 590,255 610,240 590,225" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="635" y="245" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">ALU</text>
  <text x="670" y="215" fill="#ef4444" font-size="10" font-family="Segoe UI">Zero</text>
  
  <!-- Data Memory -->
  <rect x="730" y="180" width="130" height="150" fill="#1e293b" stroke="#eab308" stroke-width="2" rx="6"/>
  <text x="795" y="235" fill="#eab308" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Data Memory</text>
  <text x="750" y="265" fill="#94a3b8" font-size="11" font-family="Segoe UI">Address</text>
  <text x="750" y="295" fill="#94a3b8" font-size="11" font-family="Segoe UI">Write Data</text>
  
  <!-- WB Mux -->
  <rect x="890" y="220" width="30" height="70" fill="#334155" stroke="#a855f7" rx="4"/>
  <text x="905" y="260" fill="#a855f7" font-size="10" text-anchor="middle" font-family="Segoe UI">Mux</text>
  
  <!-- Arrows -->
  <path d="M 100 245 L 140 245" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 260 245 L 320 245" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M 470 215 L 590 200" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 470 270 L 520 275" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 550 290 L 590 280" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 680 240 L 730 240" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 860 245 L 890 245" stroke="#eab308" stroke-width="2" fill="none"/>
  
  <!-- Writeback loop -->
  <path d="M 920 255 L 940 255 L 940 420 L 290 420 L 290 310 L 320 310" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" fill="none"/>
  
  <text x="475" y="470" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Segoe UI">Control Logic steers Multiplexers and RegWrite across Instruction Fetch, Decode, Execute, Memory, and Writeback stages.</text>
</svg>
