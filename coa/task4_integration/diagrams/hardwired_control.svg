<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" fill="#0f172a" rx="10"/>
  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Hardwired Control Unit Architecture</text>

  <!-- Opcode Input -->
  <rect x="40" y="160" width="120" height="60" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="6"/>
  <text x="100" y="195" fill="#a855f7" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Opcode [31:26]</text>

  <!-- Decoder Block -->
  <rect x="220" y="110" width="160" height="160" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="300" y="180" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Combinational</text>
  <text x="300" y="205" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Logic Matrix</text>

  <!-- Signal Outputs -->
  <g transform="translate(450, 70)" font-family="Segoe UI" font-size="12">
    <rect x="0" y="0" width="280" height="28" fill="#1e293b" stroke="#22c55e" rx="4"/>
    <text x="15" y="19" fill="#f8fafc">RegDst (1 for R-type, 0 for I-type)</text>

    <rect x="0" y="38" width="280" height="28" fill="#1e293b" stroke="#22c55e" rx="4"/>
    <text x="15" y="57" fill="#f8fafc">ALUSrc (0 for Reg, 1 for Immediate)</text>

    <rect x="0" y="76" width="280" height="28" fill="#1e293b" stroke="#22c55e" rx="4"/>
    <text x="15" y="95" fill="#f8fafc">MemtoReg (1 for Load from Data Mem)</text>

    <rect x="0" y="114" width="280" height="28" fill="#1e293b" stroke="#22c55e" rx="4"/>
    <text x="15" y="133" fill="#f8fafc">RegWrite (1 for Writeback enabled)</text>

    <rect x="0" y="152" width="280" height="28" fill="#1e293b" stroke="#f59e0b" rx="4"/>
    <text x="15" y="171" fill="#f8fafc">MemRead (1 for LD instruction)</text>

    <rect x="0" y="190" width="280" height="28" fill="#1e293b" stroke="#f59e0b" rx="4"/>
    <text x="15" y="209" fill="#f8fafc">MemWrite (1 for ST instruction)</text>

    <rect x="0" y="228" width="280" height="28" fill="#1e293b" stroke="#ef4444" rx="4"/>
    <text x="15" y="247" fill="#f8fafc">Branch (1 for BEQ / BNE conditional jump)</text>
  </g>

  <!-- Connectors -->
  <path d="M 160 190 L 220 190" stroke="#a855f7" stroke-width="3" fill="none"/>
  <path d="M 380 190 L 450 190" stroke="#38bdf8" stroke-width="3" fill="none"/>
</svg>
