<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <rect width="700" height="450" fill="#0f172a" rx="10"/>
  <text x="350" y="35" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle" font-family="Segoe UI">32-bit Arithmetic Logic Unit (ALU) Design</text>
  
  <!-- Inputs -->
  <rect x="50" y="90" width="120" height="45" fill="#1e293b" stroke="#38bdf8" rx="5"/>
  <text x="110" y="118" fill="#f8fafc" font-size="13" text-anchor="middle" font-family="Segoe UI">Operand A (32b)</text>
  
  <rect x="50" y="270" width="120" height="45" fill="#1e293b" stroke="#38bdf8" rx="5"/>
  <text x="110" y="298" fill="#f8fafc" font-size="13" text-anchor="middle" font-family="Segoe UI">Operand B (32b)</text>

  <!-- ALU Core Shape -->
  <polygon points="260,70 440,140 440,280 260,350 260,240 300,210 260,180" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="350" y="215" fill="#22c55e" font-size="20" font-weight="bold" text-anchor="middle" font-family="Segoe UI">ALU CORE</text>
  
  <!-- Control Line -->
  <path d="M 350 410 L 350 315" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <rect x="290" y="400" width="120" height="30" fill="#334155" stroke="#f59e0b" rx="4"/>
  <text x="350" y="420" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle" font-family="Segoe UI">ALUctl (4-bit)</text>
  
  <!-- Operations inside -->
  <text x="350" y="140" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Segoe UI">ADD: 0010 | SUB: 0110</text>
  <text x="350" y="160" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Segoe UI">MUL: 0101 | SLT: 0111</text>
  <text x="350" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="Segoe UI">AND: 0000 | OR: 0001</text>

  <!-- Outputs -->
  <path d="M 440 180 L 550 180" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <rect x="550" y="155" width="120" height="50" fill="#1e293b" stroke="#38bdf8" rx="5"/>
  <text x="610" y="185" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Result (32b)</text>

  <path d="M 440 240 L 550 240" stroke="#ef4444" stroke-width="3" fill="none"/>
  <rect x="550" y="225" width="120" height="35" fill="#1e293b" stroke="#ef4444" rx="5"/>
  <text x="610" y="248" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Zero Flag (1b)</text>
</svg>
